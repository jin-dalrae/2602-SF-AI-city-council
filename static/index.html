<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI City Council - SF Civic Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .pulse-dot {
            animation: pulse-dot 2s infinite;
        }

        .severity-critical {
            border-left: 4px solid #ef4444;
        }

        .severity-high {
            border-left: 4px solid #f97316;
        }

        .severity-medium {
            border-left: 4px solid #eab308;
        }

        .severity-low {
            border-left: 4px solid #22c55e;
        }

        .card-enter {
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .collaboration-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4f46e5;
            border-radius: 10px;
        }

        .brain-flash {
            animation: flashIndigo 1.5s ease-out;
        }

        @keyframes flashIndigo {
            0% {
                background-color: rgba(79, 70, 229, 0.2);
            }

            100% {
                background-color: transparent;
            }
        }
    </style>
</head>

<body class="bg-gray-950 text-gray-100 min-h-screen">
    <!-- Header -->
    <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-xl font-bold">AI
                </div>
                <div>
                    <h1 class="text-xl font-bold">AI City Council</h1>
                    <p class="text-xs text-gray-400">Real-time SF Civic Intelligence for Citizens</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center bg-gray-800 rounded-lg p-1 border border-gray-700">
                    <button id="btn-start" onclick="startAgents()"
                        class="px-3 py-1.5 rounded-md text-xs font-bold transition flex items-center gap-1.5 hover:bg-gray-700">
                        <span class="w-2 h-2 rounded-full bg-green-500"></span>
                        START
                    </button>
                    <button id="btn-stop" onclick="stopAgents()"
                        class="px-3 py-1.5 rounded-md text-xs font-bold transition flex items-center gap-1.5 hover:bg-gray-700">
                        <span class="w-2 h-2 rounded-full bg-red-500"></span>
                        STOP
                    </button>
                </div>
                <div id="connection-status" class="flex items-center gap-2 text-sm text-gray-400">
                    <span class="w-2 h-2 rounded-full bg-yellow-500 pulse-dot"></span>
                    Connecting...
                </div>
                <div id="last-updated" class="text-sm text-gray-500"></div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-[1600px] mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        <div class="lg:col-span-3">
            <!-- Stats Bar -->
            <div id="stats-bar" class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
            </div>

            <!-- Agent Cards Grid -->
            <div id="findings-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-4">
                <!-- Loading placeholders -->
                <div class="col-span-full text-center py-20 text-gray-500">
                    <div class="text-4xl mb-4">🏛️</div>
                    <p class="text-lg">Agents are analyzing SF open data...</p>
                    <p class="text-sm mt-2">First findings will appear within 60 seconds</p>
                </div>
            </div>
        </div>

        <!-- Right Side: Brain Feed -->
        <div class="lg:col-span-1 flex flex-col gap-4">
            <div
                class="bg-gray-900 border border-gray-800 rounded-xl p-4 sticky top-24 max-h-[calc(100vh-120px)] flex flex-col">
                <div class="flex items-center justify-between mb-4 pb-2 border-b border-gray-800">
                    <h2 class="font-bold flex items-center gap-2">
                        <span class="text-indigo-400">🧠</span> Agent Brain Feed
                    </h2>
                    <span id="brain-count" class="text-[10px] bg-indigo-600 px-1.5 py-0.5 rounded-full">0</span>
                </div>
                <div id="brain-feed" class="flex-1 overflow-y-auto space-y-3 pr-1 custom-scrollbar">
                    <div class="text-center py-10 text-gray-600 text-xs italic">
                        Agents are warming up their analytical models...
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Email Modal -->
    <div id="email-modal"
        class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-start justify-center overflow-y-auto p-4 py-10">
        <div class="bg-gray-900 rounded-xl border border-gray-700 w-full max-w-lg relative">
            <div class="p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold">Share Report with City Officials</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
                </div>
                <form id="email-form" class="space-y-3">
                    <input type="hidden" id="email-agent-name">
                    <div class="flex items-center gap-2 bg-indigo-900/30 border border-indigo-800 p-2 rounded-lg mb-2">
                        <input type="checkbox" id="email-to-admin" checked
                            class="w-4 h-4 rounded border-gray-700 bg-gray-800 text-indigo-600">
                        <label for="email-to-admin" class="text-xs text-indigo-300 font-medium">Include City
                            Administrator (Carmen Chu)</label>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Your Name</label>
                        <input type="text" id="email-citizen"
                            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm"
                            placeholder="A concerned resident" value="A concerned resident">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Desired Action (AI Suggested)</label>
                        <input type="text" id="email-outcome"
                            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm"
                            placeholder="What should the city do?">
                    </div>
                    <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-500 rounded-lg py-2 text-sm font-medium transition">
                        Finalize & View Report
                    </button>
                </form>
                <div id="email-result" class="hidden mt-4 bg-gray-800 rounded-lg p-4">
                    <h4 class="text-sm font-bold text-gray-300 mb-2">Generated Draft:</h4>
                    <p class="text-sm text-indigo-400 mb-1" id="email-result-to"></p>
                    <p class="text-sm font-medium mb-2" id="email-result-subject"></p>
                    <pre class="text-sm text-gray-300 whitespace-pre-wrap mb-4" id="email-result-body"></pre>
                    <button id="btn-send-email"
                        class="w-full bg-green-600 hover:bg-green-500 rounded-lg py-2 text-sm font-medium transition flex items-center justify-center gap-2">
                        <span>🚀</span> Send Email via Composio
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-start justify-center overflow-y-auto p-4 py-10">
        <div class="bg-gray-900 rounded-2xl border border-gray-700 w-full max-w-2xl relative">
            <button onclick="closeDetailModal()"
                class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl z-10">&times;</button>
            <div id="detail-content" class="p-6">
                <!-- Content populated by JS -->
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

    <script src="/static/app.js"></script>
</body>

</html>
